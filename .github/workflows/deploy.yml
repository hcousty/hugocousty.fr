# Déploiement sur l'hébergement mutualisé OVH, en SFTP.
#
# Déclenchement MANUEL uniquement (onglet Actions → Déployer sur OVH → Run workflow).
# Au lancement, choisir le contenu :
#   - « provisoire » : la page d'attente (provisoire/index.html) devient l'accueil,
#     avec les assets et les pages légales ;
#   - « site complet » : tout le site.
# Pour automatiser à chaque push sur main le jour de la mise en ligne, ajouter :
#   on:
#     push:
#       branches: [main]
#
# À configurer une fois dans GitHub : Settings → Secrets and variables → Actions
#   Secrets :
#     FTP_SERVER    ex. ftp.cluster0XX.hosting.ovh.net   (onglet FTP-SSH de l'hébergement)
#     FTP_USERNAME  ex. hugocoxxx                        (le login FTP principal)
#     FTP_PASSWORD  le mot de passe FTP défini dans l'espace client
#   Variable (facultative) :
#     DEPLOY_PROTOCOL  "sftp" (par défaut, chiffré, nécessite SFTP activé dans
#                      l'onglet FTP-SSH) ou "ftp" (en clair, si SFTP indisponible).
#
# OVH mutualisé ne propose pas de FTPS (FTP sur TLS) : c'est SFTP ou FTP simple.
# lftp gère les deux avec les mêmes identifiants.

name: Déployer sur OVH

on:
  workflow_dispatch:
    inputs:
      contenu:
        description: "Ce qui part en ligne"
        type: choice
        options:
          - provisoire     # page d'attente (provisoire/index.html) en accueil + pages légales
          - site complet   # tout le site
        default: provisoire

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    name: Envoi vers www/
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Préparer les fichiers à envoyer
        env:
          CONTENU: ${{ inputs.contenu }}
        run: |
          set -eu
          mkdir _site
          if [ "$CONTENU" = "provisoire" ]; then
            # Page d'attente en accueil, avec ce dont elle a besoin
            cp provisoire/index.html _site/index.html
            cp -r assets mentions-legales confidentialite .htaccess _site/
          else
            # Tout le site, sauf ce qui ne doit jamais partir
            tar -cf - \
              --exclude=./.git --exclude=./.github --exclude=./.gitignore \
              --exclude="*.md" --exclude=./provisoire --exclude=./vercel.json \
              --exclude=./_site . | tar -xf - -C _site
          fi
          echo "Contenu envoyé : $CONTENU"
          find _site -maxdepth 1 | sort

      - name: Envoyer les fichiers
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
        run: |
          set -eu
          if [ -z "$SERVER" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "Secrets FTP_SERVER, FTP_USERNAME et FTP_PASSWORD manquants." >&2
            exit 1
          fi
          case "$PROTOCOL" in
            sftp) PORT=22 ;;
            ftp)  PORT=21 ;;
            *) echo "DEPLOY_PROTOCOL doit valoir sftp ou ftp." >&2; exit 1 ;;
          esac

          # mirror -R : envoie le dossier préparé (_site) vers le serveur.
          # Pas de --delete : un fichier retiré du dépôt reste sur le serveur
          # (à supprimer à la main). Passer de « provisoire » à « site complet »
          # remplace simplement index.html et ajoute le reste.
          lftp -u "$USERNAME","$PASSWORD" -p "$PORT" "$PROTOCOL://$SERVER" <<'LFTP'
            set net:timeout 30
            set net:max-retries 3
            set sftp:auto-confirm yes
            set ftp:ssl-allow no
            mirror -R --verbose --only-newer _site/ www/
            bye
          LFTP
